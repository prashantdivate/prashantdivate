---
layout: default
---

<section class="page-shell">
  <div class="page-heading">
    <p class="eyebrow">{{ page.kicker }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </div>
  <div class="content prose">
    {{ content }}
  </div>
</section>
