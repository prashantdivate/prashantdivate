---
layout: default
---

<article class="post-shell">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">Back to writing</a>
  <header class="post-header">
    <p class="eyebrow">{{ page.category | default: "Essay" }}</p>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.reading_time %}<span>{{ page.reading_time }}</span>{% endif %}
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
